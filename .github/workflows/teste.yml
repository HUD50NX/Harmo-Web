name: Teste Vercel
on: { push: { branches: [teste-vercel] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir o; U="https://www.cifraclub.com.br/hillsong-united/oceans-where-feet-may-fail/"
          curl -s -m 40 -H "Origin: https://harmo-web.vercel.app" "https://r.jina.ai/$U" -o o/md.txt
          curl -s -m 40 -H "X-Return-Format: html" "https://r.jina.ai/$U" -o o/html.txt
          curl -s -m 40 -H "X-Return-Format: html" -H "X-Target-Selector: pre" "https://r.jina.ai/$U" -o o/pre.txt
          curl -s -m 40 -H "X-Return-Format: html" "https://r.jina.ai/https://www.cifraclub.com.br/aline-barros/musicas.html" -o o/art.txt
          wc -c o/*
          git config user.name t; git config user.email t@x; git checkout -q --orphan teste-out; git rm -rfq --cached .; git add o; git commit -qm r; git push -qf origin teste-out
