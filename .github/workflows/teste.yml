name: Teste Vercel
on: { push: { branches: [teste-vercel] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 60
          curl -s https://harmo-web.vercel.app/api/sonda > r.txt; echo >> r.txt
          curl -s https://harmo-web.vercel.app/api/sonda2 >> r.txt; echo >> r.txt
          cat r.txt
          git config user.name t; git config user.email t@x; git checkout -q --orphan teste-out; git rm -rfq --cached .; git add r.txt; git commit -qm r; git push -qf origin teste-out
