<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Harmonia ilustrada</title>
<style>html,body{background:#121317}.app{padding-bottom:env(safe-area-inset-bottom)}</style>
<style>
:root{--line:rgba(255,255,255,.09);--mut:#B0B6BF;--ac:#FF8A1E;--maj:#FF5FA2;--min:#4FD8FF;--aug:#8BE04E;--dim:#B18CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1013;color:#fff;font:15px/1.35 system-ui,Roboto,sans-serif;overflow:hidden}
.app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);padding:8px 12px;border-radius:12px;font:inherit;font-size:14px;font-weight:600}
.tabs button.on{background:#33363D;color:#fff;border-color:#4a4e57}
.opts{display:flex;gap:6px;align-items:center;padding:2px 12px 6px;flex-wrap:wrap;min-height:40px}
.opts select{background:#24272E;color:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font:inherit;font-size:14px;font-weight:700}
.chip{border:1px solid var(--line);background:none;color:var(--mut);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600}
.chip.on{background:var(--ac);color:#1A1C21;border-color:var(--ac)}
.lbl{color:var(--mut);font-size:13px}
.stage{flex:1;min-height:0;position:relative}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
text{pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(36,39,46,.9);color:#fff;font-size:19px}
.info{margin:0 12px;line-height:1.4;background:rgba(36,39,46,.92);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-height:52px;font-size:14px;max-height:92px;overflow:auto}
.info .m{color:var(--mut);font-size:13px}
.ft{padding:8px 12px 12px;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:700;background:#33363D;color:#fff}
.btn.ac{background:var(--ac);color:#1A1C21}
.hid{display:none!important}
body.learn .info{max-height:46vh;font-size:15px}body.learn .stage{min-height:240px}body.learn #zoom{display:none}
.pre{display:flex;gap:6px;padding:6px 12px 0;flex-wrap:wrap}.pre:empty{display:none}
.pre button{border:1px solid #4a4e57;background:#24272E;color:#fff;border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700}
.my{margin:6px 12px;display:flex;gap:4px;align-items:center;overflow-x:auto;min-height:38px;padding:4px 8px;border:1px dashed #4a4e57;border-radius:12px;scrollbar-width:none}
.my::-webkit-scrollbar{display:none}
.my .h{color:var(--mut);font-size:13px;white-space:nowrap}
.my b{flex:0 0 auto;border-radius:9px;padding:4px 9px;font-size:14px;border:1.5px solid}
.my b.lit{background:var(--ac)!important;color:#111!important;border-color:var(--ac)!important}
.my i{color:var(--mut);font-style:normal}
/* buscador */
.bus{position:absolute;inset:0;overflow:auto;padding:4px 12px 12px}
.kbd{position:relative;height:120px;margin:4px 0 10px}
.kbd div{position:absolute;top:0;border-radius:0 0 8px 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font-weight:700;font-size:13px}
.kbd .w{height:120px;background:#E9EBEF;color:#333;border:1px solid #0004}
.kbd .b{height:74px;background:#2B2C30;color:#ddd;z-index:2;font-size:11px}
.kbd .n{font-size:10px;font-weight:700;background:#1A1C21;color:#fff;border-radius:8px;padding:1px 5px;margin-bottom:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tbl .tr{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0}
.tbl .th{width:58px;flex:0 0 58px;color:var(--mut);font-size:13px;padding-top:6px}
.tbl .th b{display:block;color:#fff;font-size:15px}
.tbl .cs{display:flex;gap:6px;flex-wrap:wrap}
.cc{background:#1c1e23;border:1px solid var(--line);border-radius:10px;padding:5px 8px;text-align:center;min-width:52px}
.cc .nm{font-weight:800;font-size:14px}
.cc .ds{display:flex;gap:3px;justify-content:center;margin-top:4px}
.cc .ds i{width:10px;height:4px;border-radius:2px;background:#555}
</style></head><body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div class="opts" id="opts"></div>
  <div class="stage" id="stage">
    <svg id="svg"></svg>
    <div class="zoom" id="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zf" style="font-size:14px">⤢</button></div>
    <div class="bus hid" id="bus"></div>
  </div>
  <div class="pre" id="pre"></div>
  <div class="my" id="my"></div>
  <div class="info" id="info"></div><div id="pop" class="hid" style="position:fixed;left:16px;right:16px;bottom:120px;max-width:600px;margin:auto;background:#33363D;border:1px solid #FF8A1E;border-radius:14px;padding:12px;z-index:9;font-size:15px"></div>
  <div class="ft" id="ft"><button class="btn ac" id="pM">▶ Tocar meu caminho</button><button class="btn" id="uM" style="flex:0 0 56px">↶</button><button class="btn" id="cM" style="flex:0 0 90px">Limpar</button></div>
</div>
<script>
// =================== teoria ===================
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const MIXN=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const COL={M:'#FF5FA2',m:'#4FD8FF','+':'#8BE04E',o:'#B18CFF',7:'#F4C542'};
const QD={M:{iv:[0,4,7],s:''},m:{iv:[0,3,7],s:'m'},'+':{iv:[0,4,8],s:'+'},o:{iv:[0,3,6],s:'°'}};
const rootName=(r,q)=>q==='m'||q==='o'?(['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'])[r]:FL[r];
const TRI=[],BY={};
for(const q of ['M','m','+','o'])for(let r=0;r<12;r++){const pcs=QD[q].iv.map(i=>(r+i)%12);const k=[...pcs].sort((a,b)=>a-b).join(',');
  if(BY[k])continue;const c={r,q,pcs,k,name:rootName(r,q)+QD[q].s};BY[k]=c;TRI.push(c);}
const ch=(r,q)=>BY[QD[q].iv.map(i=>(r+i)%12).sort((a,b)=>a-b).join(',')];
const LET='CDEFGAB',NAT=[0,2,4,5,7,9,11];
function spell(c){if(c.sp)return c.sp;const rn=c.name.match(/^[A-G][b#]?/)[0],li=LET.indexOf(rn[0]),sp={};
  c.pcs.forEach((p,k)=>{const L=(li+[0,2,4][k])%7;let d=((p-NAT[L])%12+12)%12;if(d>6)d-=12;sp[p]=LET[L]+(d===1?'#':d===2?'##':d===-1?'b':d===-2?'bb':'');});return c.sp=sp;}
const nn=(c,p)=>spell(c)[p]??FL[p];
const notesTxt=c=>c.pcs.map(p=>nn(c,p)).join(' ');
const shared=(a,b)=>a.pcs.filter(p=>b.pcs.includes(p));
let EXT=false; // incluir aumentado e diminuto
// aum/dim: só perto do caminho marcado (ou do acorde principal da aba), pra não pesar
function nearMy(c){let A=(typeof MY!=='undefined'?MY:[]).filter(x=>TRI.includes(x));if(!A.length&&typeof V!=='undefined'&&V[cur]&&V[cur].anchor)A=V[cur].anchor();
  return A.includes(c)||A.some(a=>a.q!=='+'&&a.q!=='o'&&shared(a,c).length===2);}
const okType=c=>c.q==='M'||c.q==='m'||(EXT&&nearMy(c));
function nbs(c){return TRI.filter(t=>t!==c&&okType(t)&&shared(c,t).length===2);}
function changed(a,b){return nn(a,a.pcs.find(x=>!b.pcs.includes(x)))+'→'+nn(b,b.pcs.find(x=>!a.pcs.includes(x)));}
function rel(a,b){if(!(a.q==='M'||a.q==='m')||!(b.q==='M'||b.q==='m'))return b.q==='+'?'aumentado':b.q==='o'?'diminuto':'';
  if(a.r===b.r)return 'homônimo';if(a.q==='M')return b.r===(a.r+9)%12?'relativo':'anti-relativo';return b.r===(a.r+3)%12?'relativo':'anti-relativo';}
const C0=ch(0,'M');

// =================== som: o piano do Harmo (mesma conta do SynthCore) ===================
let AC,OUT,timers=[];const SR0=44100,BUF={};
function ctx(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;comp.connect(AC.destination);
    OUT=AC.createGain();OUT.gain.value=1;OUT.connect(comp);
    // reverb pequeno (sala), 25% como no app
    const len=AC.sampleRate*1.6,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.5;}
    const cv=AC.createConvolver();cv.buffer=ir;const wet=AC.createGain();wet.gain.value=.22;OUT.connect(cv);cv.connect(wet);wet.connect(comp);}
  if(AC.state==='suspended')AC.resume();return AC;}
function pianoBuf(midi,vel){const key=midi+'_'+vel;if(BUF[key])return BUF[key];
  const SR=AC.sampleRate,secs=midi<48?4:3,N=Math.floor(SR*secs),b=AC.createBuffer(1,N,SR),y=b.getChannelData(0);
  const f=440*Math.pow(2,(midi-69)/12),B=Math.max(.00005,Math.min(.002,.0001*Math.pow(2,(midi-48)/18))),tau1=Math.max(.9,Math.min(9,8*Math.pow(2,-(midi-36)/16)));
  const br=.5,bright=Math.min(1.4,(.35+.5*vel)*(.4+1.2*br)),cut=2500+4000*br;const P=[];
  for(let n=1;n<=8;n++){const fn=n*f*Math.sqrt(1+B*n*n);if(fn>cut)break;const a=Math.pow(n,-(2.3-1.1*bright))*(Math.abs(Math.sin(Math.PI*n/7.5))+.15),tn=tau1/(1+.45*(n-1));
    P.push({w:2*Math.PI*fn/SR,w2:n<=3?2*Math.PI*fn*(1+.0007+.0002*(n-1))/SR:0,ph2:.25*(n-1)*2*Math.PI,aF:a*.55,aS:a*.45,mF:Math.exp(-1/(SR*tn/5)),mS:Math.exp(-1/(SR*tn))});}
  let noise=.18*vel,nm=Math.exp(-1/(SR*.007)),lp=0,lpA=Math.min(.9,2*Math.PI*Math.min(4000,f*6)/SR),ml=0,kf=.2+.3*br,atk=0;
  for(let i=0;i<N;i++){let v=0;for(const p of P){const a=p.aF+p.aS;v+=p.w2?a*.5*(Math.sin(p.w*i)+Math.sin(p.w2*i+p.ph2)):a*Math.sin(p.w*i);p.aF*=p.mF;p.aS*=p.mS;}
    if(noise>1e-4){lp+=lpA*((Math.random()*2-1)*noise-lp);v+=lp;noise*=nm;}
    atk=Math.min(1,atk+1/(SR*.002));v*=atk*vel*.2;ml+=kf*(v-ml);y[i]=Math.tanh(ml*1.6*.9);}
  return BUF[key]=b;}
function note(midi,t,d,vel){const s=AC.createBufferSource();s.buffer=pianoBuf(midi,vel||.7);const g=AC.createGain();s.connect(g);g.connect(OUT);
  const td=midi<48?.2:midi<72?.12:.08;g.gain.setValueAtTime(1,t+d);g.gain.setTargetAtTime(0,t+d,td/3);s.start(t);s.stop(t+d+td*3);}
const tone=(m,t,d,v)=>note(m,t,d,v);
function voice(pcs){const out=[];for(const p of pcs){out.push(55+((p-55)%12+12)%12);}return out.sort((a,b)=>a-b);} // registro do meio: troca suave
function playPcs(pcs,bass,t,d){ctx();t=t||AC.currentTime+.04;d=d||1.6;voice(pcs).forEach((m,i)=>note(m,t+i*.012,d,.62));if(bass!=null)note(36+bass,t,d,.7);}
const play=(c,t,d)=>playPcs(c.pcs,c.r,t,d);
function seq(items,onStep,st){ctx();stop();st=st||1;const t0=AC.currentTime+.08;
  items.forEach((it,i)=>{it(t0+i*st);if(onStep)timers.push(setTimeout(()=>onStep(i),i*st*1000+80));});
  if(onStep)timers.push(setTimeout(()=>onStep(-1),items.length*st*1000+400));}
function stop(){timers.forEach(clearTimeout);timers=[];}
function scale(pcs,t0){ctx();const base=60;let last=-1;const ms=[];for(const p of pcs){let m=base+p;while(m<=last)m+=12;ms.push(m);last=m;}ms.push(base+pcs[0]+12);
  ms.forEach((m,i)=>note(m,(t0||AC.currentTime+.04)+i*.3,.45,.6));}

// =================== svg / zoom ===================
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),svg=$('svg');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!==undefined&&a[k]!=='')e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function tx(p,x,y,s,a){const t=el('text',Object.assign({x,y,'text-anchor':'middle'},a||{}),p);t.textContent=s;return t;}
let vb={x:0,y:0,w:100,h:100},box=null,refit=true;
function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}
function fitTo(b){const r=svg.getBoundingClientRect();const k=r.height/r.width;const pad=10;let w=b.w+pad*2,h=b.h+pad*2;
  if(h/w>k)w=h/k;else h=w*k;vb={x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h};setVB();}
function begin(b){svg.innerHTML='';defs();box=b;if(refit){fitTo(b);refit=false;}else setVB();}
function defs(){const d=el('defs',{},svg);const f=el('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'},d);
  el('feGaussianBlur',{stdDeviation:2.2,result:'b'},f);const m=el('feMerge',{},f);el('feMergeNode',{in:'b'},m);el('feMergeNode',{in:'SourceGraphic'},m);
  for(const [id,c] of [['ar','rgba(255,255,255,.75)'],['arG','#3DDC84'],['arY','#F4C542']]){const mk=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},d);el('path',{d:'M0,0 L10,5 L0,10 z',fill:c},mk);}}
function zoom(f,cx,cy){cx=cx??vb.x+vb.w/2;cy=cy??vb.y+vb.h/2;const nw=Math.min(4000,Math.max(60,vb.w*f));const k=nw/vb.w;vb.x=cx-(cx-vb.x)*k;vb.y=cy-(cy-vb.y)*k;vb.w=nw;vb.h*=k;setVB();}
$('zi').onclick=()=>zoom(.75);$('zo').onclick=()=>zoom(1.33);$('zf').onclick=()=>{if(box)fitTo(box);};
const ptrs=new Map();let pan=null,pinch=null;
let dragged=false;
svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}dragged=false;if(e.isPrimary){ptrs.clear();pinch=null;}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)pan={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,moved:false};
  else if(ptrs.size===2){dragged=true;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w};if(pan)pan.moved=true;}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=svg.getBoundingClientRect(),k=vb.w/r.width;
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const cx=vb.x+((a.x+b.x)/2-r.left)*k,cy=vb.y+((a.y+b.y)/2-r.top)*k;zoom(pinch.w*pinch.d/d/vb.w,cx,cy);return;}
  if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>14){pan.moved=true;dragged=true;}if(pan.moved){vb.x=pan.vx-dx*k;vb.y=pan.vy-dy*k;setVB();}}});
svg.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)pan=null;});
// toque/clique: usa o 'click' do navegador (o jeito mais confiável no celular)
svg.addEventListener('click',e=>{if(dragged){dragged=false;return;}let t=e.target;while(t&&t!==svg&&!(t.dataset&&t.dataset.tap))t=t.parentNode;
  if(t&&t.dataset&&t.dataset.tap)V[cur].tap(t.dataset.tap);});
svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pan=null;pinch=null;});
svg.addEventListener('lostpointercapture',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)pan=null;});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),k=vb.w/r.width;zoom(e.deltaY>0?1.12:.89,vb.x+(e.clientX-r.left)*k,vb.y+(e.clientY-r.top)*k);},{passive:false});

function bubble(g,c,x,y,r,st,tap,label){
  if(c&&c.name&&MY.length){if(c.name===LITN)st='on';else if(st!=='root'&&MYS().has(c.name))st='hl';}
  const C=COL[c.q]||'#fff';const fill=st==='root'||st==='on'?C:'#121317';
  const gg=el('g',{opacity:st==='dim'?.28:1},g);
  const ci=el('circle',{cx:x,cy:y,r,fill,stroke:st==='hl'?'#fff':C,'stroke-width':st==='hl'?3:1.8,filter:'url(#glow)'},gg);if(tap)ci.dataset.tap=tap;
  const s=label||c.name;const _hit=()=>{if(tap){const h=el('circle',{cx:x,cy:y,r:r+6,fill:'transparent',style:'cursor:pointer'},gg);h.dataset.tap=tap;}};tx(gg,x,y+r*.36,s,{'font-size':r*(s.length>3?.68:s.length>2?.8:.95),'font-weight':700,fill:st==='root'||st==='on'?'#111':C});_hit();
  return gg;}
function opts(html){$('opts').innerHTML=html;}
function info(h){$('info').innerHTML=h;}
function btns(a,b){$('pre').innerHTML=[a,b].map((x,i)=>x?`<button data-b="${i+1}">${x}</button>`:'').join('');$('pre').querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>V[cur]['b'+e.dataset.b]());}
function chordSelect(id,val,all){return `<select id="${id}">`+TRI.filter(c=>all||okType(c)).map(c=>`<option value="${c.k}" ${c===val?'selected':''}>${c.name}</option>`).join('')+'</select>';}
const extChip=()=>`<button class="chip ${EXT?'on':''}" id="ext">+ aum/dim perto do caminho</button>`;
function wireExt(after){const b=$('ext');if(b)b.onclick=()=>{EXT=!EXT;refit=true;after();};}
const legend=()=>`<span style="color:${COL.M}">●</span> maior <span style="color:${COL.m}">●</span> menor`+(EXT?` <span style="color:${COL['+']}">●</span> aum <span style="color:${COL.o}">●</span> dim`:'');

// =================== GLOSSÁRIO ===================
const GL={'acorde':'3 (ou mais) notas tocadas juntas. C = C + E + G.','maior':'Acorde de som "alegre". C = C E G.','menor':'Acorde de som "triste". Cm = C Eb G: só o E desceu ½ tom.',
 'homônimo':'Mesmo nome, um maior e outro menor: C e Cm. Muda só a nota do meio.','relativo':'O par maior/menor que divide 2 notas e usa as mesmas notas da escala: C e Am.',
 'anti-relativo':'O outro vizinho que divide 2 notas: C e Em (C E G → B E G).','vizinho':'Acorde que muda só 1 nota. Soa como "parente" e a troca fica suave.',
 'campo harmônico':'Os 7 acordes de um tom. Em C: C Dm Em F G Am B°.','ciclo de quintas':'Os tons em roda: C G D A E B… Cada passo sobe 5 notas (C-D-E-F-G) e ganha um ♯.',
 'ciclo de quartas':'A roda ao contrário: C F Bb Eb… É o caminho mais natural da música (G7 → C).','dominante':'O acorde V do tom (G em C). Com 7 (G7) cria tensão que resolve no I (C).',
 'aumentado':'Acorde com a 5ª subida (C+ = C E G#). Soa de "suspense", bom de passagem.','diminuto':'Acorde com 3ª e 5ª descidas (B° = B D F). Tenso, bom de passagem.',
 '½ tom':'A menor distância: de uma tecla pra vizinha colada (C → C#).','C→B':'A nota C vira B: só essa nota muda, as outras ficam.','modo':'Uma escala começando de outro lugar. Cada modo tem um "clima".'};
function gl(t,label){return `<u data-g="${t}" style="text-decoration-style:dotted;cursor:pointer">${label||t}</u>`;}
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('[data-g]');const pop=$('pop');if(g){pop.innerHTML=`<b>${g.dataset.g}</b><br>${GL[g.dataset.g]}`;pop.classList.remove('hid');e.stopPropagation();return;}if(!e.target.closest||!e.target.closest('#pop'))pop.classList.add('hid');},true);

// =================== MEU CAMINHO (todas as abas) ===================
let MY=[],LITN=null,LIT=-1;
const MYS=()=>new Set(MY.map(c=>c.name));

// =================== 1) ÁRVORE (estrela) ===================
const TREE={anchor(){return [this.root];},root:C0,depth:4,sel:null,lit:-1,nodes:[],
  build(){const N=[{c:this.root,l:0,p:-1,end:false,kids:[]}];
    for(let i=0;i<N.length;i++){const n=N[i];if(n.end||n.l>=this.depth)continue;const gp=n.p>=0?N[n.p].c:null;
      const anc=(MY.filter(x=>TRI.includes(x)).length?MY.filter(x=>TRI.includes(x)):[this.root]);
      for(const c of nbs(n.c)){const ad=c.q==='+'||c.q==='o';if(ad&&!anc.includes(n.c))continue;N.push({c,l:n.l+1,p:i,end:c===gp||ad,kids:[]});n.kids.push(N.length-1);}}
    const w=i=>N[i].w=N[i].kids.length?N[i].kids.reduce((s,k)=>s+w(k),0):1;w(0);
    const put=(i,a0,a1)=>{const n=N[i];n.a=(a0+a1)/2;let a=a0;for(const k of n.kids){const span=(a1-a0)*N[k].w/n.w;put(k,a,a+span);a+=span;}};
    const off=-Math.PI/2-Math.PI*N[N[0].kids[0]].w/N[0].w;put(0,off,off+2*Math.PI);this.nodes=N;},
  chain(i){const o=[];while(i>=0){o.unshift(i);i=this.nodes[i].p;}return o;},
  render(){
    opts(chordSelect('sR',this.root)+`<span class="lbl">níveis</span><select id="sD">${[2,3,4,5].map(d=>`<option ${d===this.depth?'selected':''}>${d}</option>`).join('')}</select>`+extChip());
    $('sR').onchange=e=>{this.root=BY[e.target.value];this.sel=null;refit=true;this.render();};
    $('sD').onchange=e=>{this.depth=+e.target.value;this.sel=null;refit=true;this.render();};
    wireExt(()=>{if(!okType(this.root))this.root=C0;this.sel=null;this.render();});
    this.build();const N=this.nodes,D=this.depth,R=70*D;
    const step=l=>R*(l/D)**.85;const RAD=[26,20,17,15,13,12];
    N.forEach(n=>{n.x=Math.cos(n.a)*step(n.l);n.y=Math.sin(n.a)*step(n.l);});
    begin({x:-R-20,y:-R-20,w:2*R+40,h:2*R+40});
    const path=this.sel!=null?this.chain(this.sel):[],inP=new Set(path);
    const gE=el('g',{},svg),gN=el('g',{},svg);
    N.forEach((n,i)=>{if(n.p<0)return;const p=N[n.p];const hot=inP.has(i);
      el('line',{x1:p.x,y1:p.y,x2:n.x,y2:n.y,stroke:hot?'#fff':'rgba(225,240,255,.42)','stroke-width':hot?3.2:1.3,filter:hot?'url(#glow)':''},gE);});
    N.forEach((n,i)=>{let st=i===0?'root':'';if(inP.has(i)&&i)st=(this.lit<0||path[this.lit]===i)?'on':'hl';if(this.sel!=null&&!inP.has(i)&&i)st='dim';
      const r=RAD[Math.min(n.l,5)]*(n.end?.85:1);const g=bubble(gN,n.c,n.x,n.y,r,st,'n'+i);if(n.end&&st!=='on')g.setAttribute('opacity',st==='dim'?.2:.55);});
    if(this.sel==null)info(`<b>${this.root.name}</b> no centro. Cada galho é um ${gl('vizinho')}: muda <b>uma nota só</b>. Bolinha apagada = volta pro acorde de antes. ${legend()}<div class="m">Toque nos acordes pra montar seu caminho · arraste e dê zoom.</div>`);
    else{const p=path.map(i=>N[i].c);info(`Do centro até aqui: <b>${p.map(c=>c.name).join(' → ')}</b> <span class="m">(use "▶ Do centro até aqui" pra ouvir)</span><div class="m">${p.slice(1).map((c,i)=>changed(p[i],c)+' ('+rel(p[i],c)+')').join(' · ')}</div>`);}
    btns(this.sel==null?'▶ Vizinhos':'▶ Do centro até aqui','Centralizar');},
  tap(t){const i=+t.slice(1);this.sel=i||null;this.lit=-1;addMy(this.nodes[i].c);},
  b1(){if(this.sel==null){setMy(nbs(this.root).flatMap(n=>[this.root,n]));return;}setMy(this.chain(this.sel).map(i=>this.nodes[i].c));},
  b2(){const l=[...MY].reverse().find(c=>BY[c.pcs.slice().sort((a,b)=>a-b).join(',')]===c);this.root=l||C0;this.sel=null;refit=true;this.render();}};

// =================== 2) PIRÂMIDE (notas do acorde) ===================
const PYR={anchor(){return [this.top];},top:C0,note:null,sel:null,lvl3:false,
  render(){
    opts(chordSelect('sR',this.top)+extChip()+`<button class="chip ${this.lvl3?'on':''}" id="l3">3º nível</button>`);
    $('sR').onchange=e=>{this.top=BY[e.target.value];this.note=null;refit=true;this.render();};
    $('l3').onclick=()=>{this.lvl3=!this.lvl3;refit=true;this.render();};
    wireExt(()=>{if(!okType(this.top))this.top=C0;this.render();});
    const T=this.top,ord=[2,0,1].map(i=>T.pcs[i]); // 5ª, fundamental, 3ª
    const pool=TRI.filter(c=>okType(c)&&c!==T);
    const L1=pool.filter(c=>shared(c,T).length===2).sort((a,b)=>ord.indexOf(T.pcs.find(p=>!b.pcs.includes(p)))-ord.indexOf(T.pcs.find(p=>!a.pcs.includes(p)))||'Mm+o'.indexOf(a.q)-'Mm+o'.indexOf(b.q));
    const L2=pool.filter(c=>shared(c,T).length===1).sort((a,b)=>ord.indexOf(shared(a,T)[0])-ord.indexOf(shared(b,T)[0])||'Mm+o'.indexOf(a.q)-'Mm+o'.indexOf(b.q)||a.r-b.r);
    const L3=this.lvl3?pool.filter(c=>shared(c,T).length===0).sort((a,b)=>'Mm+o'.indexOf(a.q)-'Mm+o'.indexOf(b.q)||a.r-b.r):[];
    const rows=[[T],L1,L2].concat(L3.length?[L3]:[]);const DX=60,DY=160;const W=Math.max(...rows.map(r=>r.length))*DX;
    begin({x:-W/2,y:-30,w:W,h:DY*(rows.length-1)+60});
    const gL=el('g',{},svg),gN=el('g',{},svg);
    const pos=new Map();rows.forEach((row,i)=>row.forEach((c,j)=>pos.set(c,{x:(j-(row.length-1)/2)*DX,y:i*DY,lvl:i})));
    // posição de cada nota (acima/abaixo do acorde)
    const nx=(c,p)=>{const q=pos.get(c);const k=c.pcs.indexOf(p);return q.x+(k-1)*13;};
    const hotC=c=>this.note!=null&&c.pcs.includes(this.note);
    for(let i=0;i<rows.length-1;i++)for(const a of rows[i])for(const b of rows[i+1])for(const p of shared(a,b)){
      const hot=this.note===p;const pa=pos.get(a),pb=pos.get(b);
      el('line',{x1:nx(a,p),y1:pa.y+38,x2:nx(b,p),y2:pb.y-36,stroke:hot?'#3DDC84':'rgba(255,255,255,.33)','stroke-width':hot?2.4:.8},gL);}
    rows.forEach((row,i)=>row.forEach(c=>{const q=pos.get(c);const st=this.sel===c?'on':(this.note!=null&&!hotC(c)?'dim':'');
      bubble(gN,c,q.x,q.y,23,i===0?'root':st,'c'+c.k);
      for(const [yy,show] of [[q.y-28,i>0],[q.y+34,i<rows.length-1]])if(show)c.pcs.forEach(p=>{const hot=this.note===p;
        const t=tx(gN,nx(c,p),yy,nn(c,p),{'font-size':10,'font-weight':hot?800:500,fill:hot?'#3DDC84':'#ddd'});});
      if(i===0)c.pcs.forEach(p=>{const r=el('rect',{x:nx(c,p)-7,y:q.y+22,width:14,height:18,fill:'transparent'},gN);r.dataset.tap='p'+p;});
      if(i===0)c.pcs.forEach(p=>{if(this.note===p)el('circle',{cx:nx(c,p),cy:q.y+30,r:9,fill:'none',stroke:'#3DDC84','stroke-width':2},gN);});}));
    rows.forEach((row,i)=>{if(!i)return;tx(gN,-W/2+4,i*DY-52,['','Muda 1 nota','Fica 1 nota','Nenhuma nota igual'][i],{'text-anchor':'start','font-size':11,fill:'#8a9099'});});
    const s=this.note!=null?`Nota <b style="color:#3DDC84">${nn(T,this.note)}</b>: aparece em ${rows.flat().filter(c=>c!==T&&c.pcs.includes(this.note)).map(c=>c.name).join(', ')}.`:
      `<b>${T.name}</b> (${notesTxt(T)}). Cada linha é uma <b>nota em comum</b>. ${legend()}`;
    info(s+`<div class="m">Toque numa nota do ${T.name} (embaixo dele) pra seguir ela · toque nos acordes pra montar seu caminho.</div>`);
    btns('▶ Nível 1','Último pro topo');},
  tap(t){if(t[0]==='p'){const p=+t.slice(1);this.note=this.note===p?null:p;this.render();return;}
    const c=BY[t.slice(1)];this.sel=c;addMy(c);},
  b1(){const L1=TRI.filter(c=>okType(c)&&c!==this.top&&shared(c,this.top).length===2);setMy(L1.flatMap(n=>[this.top,n]));},
  b2(){const l=[...MY].reverse().find(c=>TRI.includes(c));if(l){this.top=l;this.note=null;this.sel=null;refit=true;this.render();}}};

// =================== 3) CICLOS / CUBO (3 polos a terça maior) ===================

  render(){
    opts(`<span class="lbl">Tons a terça maior + aumentados que ligam tudo</span>`);
    begin({x:-250,y:-250,w:500,h:500});
    const gL=el('g',{},svg),gS=el('g',{},svg),gN=el('g',{},svg);
    const P={};const centers=[[0,-150],[150,0],[0,150],[-150,0]];
    for(let i=0;i<4;i++){const [cx,cy]=centers[i];const seqC=[ch(i,'M'),ch(i,'m'),ch(i+8,'M'),ch(i+8,'m'),ch(i+4,'M'),ch(i+4,'m')];
      seqC.forEach((c,j)=>{const a=-Math.PI/2+j*Math.PI/3+i*Math.PI/2;P[c.k]={x:cx+Math.cos(a)*62,y:cy+Math.sin(a)*62};});

      for(const c of TRI.filter(t=>(t.q==='M'||t.q==='m')&&shared(t,A).length===2))el('line',{x1:P[A.k].x,y1:P[A.k].y,x2:P[c.k].x,y2:P[c.k].y,stroke:'rgba(139,224,78,.35)','stroke-width':1},gL);}

    for(const k in P){const c=BY[k];bubble(gN,c,P[k].x,P[k].y,c.q==='+'?19:17,c===s?'root':nb.includes(c)?'hl':'', 'c'+k);}

    const pl=poles.map(p=>FL[p]).join(', ');

// =================== 4) DOMINANTES (flor) ===================

    const F=[0,7,2,9,4,11,6,1,8,3,10,5],gL=el('g',{},svg),gN=el('g',{},svg);
    const pos=(r,i,da)=>{const a=-Math.PI/2+i*Math.PI/6+(da||0);return {x:Math.cos(a)*r,y:Math.sin(a)*r};};
    const P={};F.forEach((p,i)=>{P['I'+p]=pos(210,i);P['A'+p]=pos(152,i,.13);P['7'+p]=pos(100,i,.13);});

    F.forEach((p,i)=>{const v=(p+7)%12,a=P['I'+v],b=P['I'+p],cx=(a.x+b.x)/2*1.32,cy=(a.y+b.y)/2*1.32;

      ln(P['I'+v],P['A'+v],'2 3','#3DDC84');ln(P['A'+v],P['I'+p],'','#3DDC84');ln(P['7'+v],P['I'+p],'','#F4C542');

      el('rect',{x,y:ky,width:ww-1.5,height:90,rx:4,fill:c||'#E9EBEF'},g);if(c)tx(g,x+ww/2,ky+80,nn(S.q?S:ch(0,'M'),p)||FL[p],{'font-size':12,'font-weight':800,fill:'#111'});});
    for(let o=0;o<2;o++)[1,3,6,8,10].forEach(p=>{const m=o*12+p,wi=WI.filter(w=>w<p).length,x=kx+(o*7+wi)*ww-ww*.3,c=keyCol(m);
      el('rect',{x,y:ky,width:ww*.6,height:56,rx:3,fill:c||'#2B2C30'},g);if(c)tx(g,x+ww*.3,ky+48,FL[p],{'font-size':9,'font-weight':800,fill:'#111'});});

    tx(g,0,ky+118,`${S.name} = ${S.pcs.map(p=>(S.q==='M'||S.q==='m'||S.q==='o'||S.q==='+')?nn(S,p):FL[p]).join(' + ')}`,{'font-size':15,'font-weight':700,fill:'#ddd'});

      F.forEach((p,i)=>{const a=-Math.PI/2+i*Math.PI/6,x=Math.cos(a)*68,y=cy+Math.sin(a)*68;const on=L.ch.some(c=>c.r===p);

    info(`${L.h()}${diff?`<div style="margin-top:6px">${diff}</div>`:''}${L.try?`<div class="m" style="margin-top:4px">👉 ${L.try}</div>`:''}${q}${L.end?`<div class="m" style="margin-top:6px">Pronto! Agora use as abas <b>Círculos</b>, <b>De → Até</b> e <b>Buscador</b>. As outras (Árvore, Pirâmide…) usam essas mesmas ideias.</div>`:''}`);

  tap(t){this.sel=+t.slice(1);addMy(LESS[this.i].ch[this.sel]);},

// =================== 8) CÍRCULOS: quintas, quartas e relativas ===================
const CIRC={key:0,mode:'5',
  render(){

    const at=(r,i)=>{const a=-Math.PI/2+i*Math.PI/6;return {x:Math.cos(a)*r,y:Math.sin(a)*r};};

      const mx=(a.x+b.x)/2*1.12,my=(a.y+b.y)/2*1.12;const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);
      el('path',{d:`M${a.x+dx/L*22},${a.y+dy/L*22} Q${mx},${my} ${b.x-dx/L*24},${b.y-dy/L*24}`,fill:'none',stroke:'#F4C542','stroke-width':1.6,opacity:.7,'marker-end':'url(#arY)'},gL);});
    if(this.mode==='r')F.forEach((p,i)=>{const a=at(200,i),b=at(140,i);el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#fff','stroke-width':1.6,opacity:.6},gL);});
    if(this.mode==='f'){const w=[k-1,k,k+1].map(i=>(i+12)%12);const pts=[...w.map(i=>at(222,i)),...w.slice().reverse().map(i=>at(66,i))];
      el('polygon',{points:pts.map(p=>p.x+','+p.y).join(' '),fill:'rgba(255,138,30,.13)',stroke:'#FF8A1E','stroke-width':1.5},gL);}
    F.forEach((p,i)=>{const a=at(200,i),b=at(140,i),c=at(88,i),s=at(232,i);
